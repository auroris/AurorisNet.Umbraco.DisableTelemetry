name: New Umbraco releases

# Looks each day for new releases of the Umbraco major versions the package supports, and runs the tests on those
# releases only, with and without the browser check. A release that passes is added to UmbracoReleases on main, and the
# Release workflow publishes a package for it. A release that fails gets an issue. The jobs come from
# auroris/AurorisNet.Build, whose docs/releasing.md describes them.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      releases:
        description: Releases to test instead of the new ones, separated by commas, such as 18.3.2,17.8.2
        required: false
        default: ''
      dry-run:
        description: Show the results in the run only, without a commit, a release or an issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: umbraco-releases
  cancel-in-progress: false

jobs:
  umbraco:
    uses: auroris/AurorisNet.Build/.github/workflows/umbraco-releases.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
    with:
      runs-on: windows-latest
      timeout-minutes: 180
      # The package's own script builds each release and runs its tests, then again with the browser check. A summary
      # that is missing, as when Chromium could not be installed, fails every release.
      test-script: |
        pwsh tests/Test-UmbracoReleases.ps1 -Releases $env:RELEASES -SummaryPath artifacts/quick.json
        dotnet build tests/AurorisNet.Umbraco.DisableTelemetry.Tests -c Release -nologo
        pwsh tests/AurorisNet.Umbraco.DisableTelemetry.Tests/bin/Release/net10.0/playwright.ps1 install chromium
        if ($LASTEXITCODE -eq 0) { pwsh tests/Test-UmbracoReleases.ps1 -Releases $env:RELEASES -Browser -SummaryPath artifacts/browser.json }
      summaries: artifacts/quick.json,artifacts/browser.json
      releases: ${{ inputs.releases || '' }}
      dry-run: ${{ inputs.dry-run || false }}
