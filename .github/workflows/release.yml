name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Choose the versions, build and pack only, and keep the packages as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    # The tests run before a release, locally or in the New Umbraco releases workflow, as docs/DEVELOPING.md describes, so
    # this job only builds and publishes.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_PROJECT: src/AurorisNet.Umbraco.DisableTelemetry.csproj
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Each release publishes the same package once for each supported Umbraco major version, numbered after that major
      # version's newest supported release, such as 18.3.1.2 and 17.8.1.1. The newest major version's comes first.
      - name: Choose the package versions
        id: version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $releases = @(& .github/scripts/Get-ReleaseVersion.ps1 -BranchName $env:RELEASE_BRANCH -Commit $env:RELEASE_COMMIT)
          $releases | Format-Table Umbraco, Version, Tag -AutoSize | Out-String | Write-Host
          "versions=$($releases.Version -join ',')" >> $env:GITHUB_OUTPUT
          "tags=$($releases.Tag -join ',')" >> $env:GITHUB_OUTPUT

      # Build each version on its own, so each package's assembly carries that package's version.
      - name: Build and pack
        env:
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
        run: |
          foreach ($version in $env:RELEASE_VERSIONS.Split(',')) {
            dotnet build "$env:PACKAGE_PROJECT" -c Release -p:Version=$version
            if ($LASTEXITCODE -ne 0) { throw "Could not build $version." }
            dotnet pack "$env:PACKAGE_PROJECT" -c Release --no-build -p:Version=$version -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $version." }
          }

      # A dry run ends here, with the packages a release of this commit would publish. Nothing is tagged or published.
      - name: Keep the packages of a dry run
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      # Reserve every tag before publishing any package, so a retried run reuses all of them.
      - name: Reserve the release tags before publishing
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          foreach ($tag in $env:RELEASE_TAGS.Split(',')) {
            $existing = git tag --list "$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not check release tags.' }
            if (!$existing) {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:RELEASE_COMMIT"
              if ($LASTEXITCODE -ne 0) { throw "Could not reserve the release tag $tag." }
            }
          }

      - name: Log in to NuGet with trusted publishing
        if: ${{ !inputs.dry-run }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: AurorisNet

      - name: Publish to NuGet
        if: ${{ !inputs.dry-run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
        run: |
          foreach ($version in $env:RELEASE_VERSIONS.Split(',')) {
            dotnet nuget push "artifacts/packages/AurorisNet.Umbraco.DisableTelemetry.$version.nupkg" `
              --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Could not publish $version to NuGet." }
          }

      # The newest major version's release gets the notes from the run and the generated list of changes. It becomes the
      # latest release unless a newer one is published already, as when this run retries an older commit's release.
      # Each other release points to it, since it publishes the same package under another version number.
      - name: Publish the GitHub releases
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
          RELEASE_TAGS: ${{ steps.version.outputs.tags }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $versions = $env:RELEASE_VERSIONS.Split(',')
          $tags = $env:RELEASE_TAGS.Split(',')
          for ($i = 0; $i -lt $versions.Count; $i++) {
            $package = "artifacts/packages/AurorisNet.Umbraco.DisableTelemetry.$($versions[$i]).nupkg"
            gh release view "$($tags[$i])" --json id 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload "$($tags[$i])" "$package" --clobber
            } elseif ($i -eq 0) {
              $latest = & .github/scripts/Test-LatestRelease.ps1 -Version $versions[$i]
              $create = @('release', 'create', $tags[$i], $package, '--verify-tag', '--title', $versions[$i], '--generate-notes',
                ($latest ? '--latest' : '--latest=false'))
              # gh places these notes above the generated ones.
              if ($env:RELEASE_NOTES) { $create += @('--notes', $env:RELEASE_NOTES) }
              gh @create
            } else {
              $notes = "The same package as [$($versions[0])](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$($tags[0])), " +
                "numbered for sites on Umbraco $($versions[$i].Split('.')[0]), which can float on ``$($versions[$i].Split('.')[0]).*``."
              gh release create "$($tags[$i])" "$package" --verify-tag --title "$($versions[$i])" --notes "$notes" --latest=false
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release $($tags[$i])." }
          }
