name: Release

run-name: Release${{ inputs.dry-run && ' (dry run)' || '' }}

# Publishes the package to nuget.org and GitHub. Starts by hand, or from the Weekly release workflow when a new
# Umbraco release has passed the tests. The shared steps come from auroris/AurorisNet.Build, whose docs/releasing.md
# describes them. nuget.org trusts this file by its name, so keep it release.yml, and keep the repository's tag rule
# that stops v* tags from being moved or deleted: the version step counts past every existing tag.
on:
  workflow_dispatch:
    inputs:
      test:
        description: Run the tests before publishing.
        type: boolean
        default: true
      dry-run:
        description: Choose the versions, test and pack only, and keep the packages as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  release:
    name: Test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_PROJECT: src/AurorisNet.Umbraco.DisableTelemetry.csproj
      TEST_PROJECT: tests/AurorisNet.Umbraco.DisableTelemetry.Tests
      # Makes the build deterministic and, with Directory.Build.props, turns its warnings into errors.
      ContinuousIntegrationBuild: 'true'
    steps:
      # The version step reads every release tag, so the checkout needs the full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # global.json keeps the build on a .NET 10 SDK, whichever other SDKs the runner has.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Each release publishes the same package once for each supported Umbraco major version, numbered after that major
      # version's newest supported release, such as 18.3.2.1 and 17.8.2.1. The newest major version's comes first.
      - name: Choose the versions
        id: version
        uses: auroris/AurorisNet.Build/actions/version@main
        with:
          scheme: umbraco
          dry-run: ${{ inputs.dry-run }}

      # The tests boot a real Umbraco site with SQLite, on the newest supported release. The other releases are tested
      # on a developer's machine, as the README's Developing section describes.
      - name: Test
        if: ${{ inputs.test }}
        run: |
          dotnet test --project "$env:TEST_PROJECT" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }

      # Build each version on its own, so each package's assembly carries that package's version.
      - name: Build and pack
        env:
          RELEASE_VERSIONS: ${{ steps.version.outputs.versions }}
        run: |
          foreach ($version in $env:RELEASE_VERSIONS.Split(',')) {
            dotnet build "$env:PACKAGE_PROJECT" -c Release "-p:Version=$version"
            if ($LASTEXITCODE -ne 0) { throw "Could not build $version." }
            dotnet pack "$env:PACKAGE_PROJECT" -c Release --no-build "-p:Version=$version" -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $version." }
          }

      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ steps.version.outputs.versions }}
          dry-run: ${{ inputs.dry-run }}
          notes: ${{ inputs.notes }}
